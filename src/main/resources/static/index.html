<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliothèque</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 1rem; }
        .panel { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 0.75rem 0; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #d1d5db; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        button.secondary { background: #e5e7eb; color: #111827; }
        .muted { color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <h1>Gestion de la bibliothèque</h1>
        <a href="/login.html" class="muted">Connexion</a>
    </div>

    <div class="panel">
        <h3>Recherche</h3>
        <form id="search-form">
            <input type="text" id="search-title" placeholder="Titre" />
            <input type="text" id="search-author" placeholder="Auteur" />
            <input type="text" id="search-category" placeholder="Catégorie" />
            <button type="submit" class="secondary">Rechercher</button>
        </form>
    </div>

    <div class="panel">
        <h3>Ajouter un livre</h3>
        <form id="book-form">
            <input type="text" id="title" placeholder="Titre" required />
            <input type="text" id="author" placeholder="Auteur" required />
            <input type="text" id="isbn" placeholder="ISBN" required />
            <button type="submit">Ajouter</button>
        </form>
    </div>

    <div class="panel">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Titre</th>
                <th>Auteur</th>
                <th>ISBN</th>
                <th>Disponible</th>
            </tr>
            </thead>
            <tbody id="books-body"></tbody>
        </table>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
