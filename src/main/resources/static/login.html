<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; display: grid; place-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: min(420px, 90vw); }
        form { display: grid; gap: 12px; }
        input, button { padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Connexion</h2>
    <p id="login-error" style="color:#dc2626; display:none;"><strong>Nom d'utilisateur ou mot de passe incorrect.</strong></p>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Nom d'utilisateur" required />
        <input type="password" name="password" placeholder="Mot de passe" required />
        <button type="submit">Se connecter</button>
    </form>
    <p>Compte utilisateur : <strong>user</strong> / <strong>user123</strong></p>
    <p>Compte admin : <strong>admin</strong> / <strong>admin123</strong></p>
</div>
<script>
    if (new URLSearchParams(window.location.search).has('error')) {
        document.getElementById('login-error').style.display = 'block';
    }
</script>
</body>
</html>
